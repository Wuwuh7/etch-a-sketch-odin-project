<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="style.css" rel="stylesheet"></link>
    <link href="reset.css" rel="stylesheet"></link>
</head>
<body>
    <div class="container">
        <div class="title"><h1>SKETCH PAD</h1></div>
        <div class="content">
            <div class="board"></div>
            <div class="buttons">
                <button value="black" class="colorButton" onclick="changeColor(value)">Black</button>
                <button value="white" class="colorButton" onclick="changeColor(value)">White</button>
                <button value="random" class="colorButton" onclick="changeColor(value)">Random</button>
                <button value="reset" class="colorButton" onclick="resetColor()">Reset</button>
            </div>
            <div>
                <input type="text" placeholder="Size of board" value="16" onchange="changeSize(this.value)">
                <button>Set Size</button>
            </div>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
